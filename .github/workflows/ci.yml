name: CI
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ATM.slnx
      - name: Build
        run: dotnet build ATM.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ATM.slnx -c Release --no-build
      - name: Verify formatting
        run: dotnet format whitespace ATM.slnx --verify-no-changes --no-restore
